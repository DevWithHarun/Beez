spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/beez}
    username: ${DATABASE_USERNAME:beez}
    password: ${DATABASE_PASSWORD:beez-dev-only}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  error:
    include-message: always

beez:
  auth:
    refresh-cookie-secure: false
