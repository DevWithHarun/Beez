openapi: 3.1.0
info:
  title: Beez API
  version: 0.1.0
  description: >
    Authentication/session, catalogue, merchant shop/product and orders,
    rider dispatch and earnings, and guest basket routes are implemented.
    Authentication, merchant order, rider earnings, and Daraja checkout
    contracts are documented here; catalogue and guest basket response shapes
    are summarized in their owning module READMEs.
servers:
  - url: /api/v1
paths:
  /auth/otp/login/request:
    post:
      operationId: requestLoginOtp
      summary: Request a one-time code for an existing account
      description: >
        Looks up the account role from the normalized phone number. Responses
        do not reveal whether a phone is registered; unknown, inactive, and
        admin accounts receive the same generic response without an SMS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Kenyan mobile number; common local and +254 formats accepted.
                  example: "0712345678"
      responses:
        "200":
          description: Generic accepted response, independent of account existence.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds, retryAfterSeconds, message]
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  expiresInSeconds:
                    type: integer
                    const: 300
                  retryAfterSeconds:
                    type: integer
                    const: 60
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /auth/otp/request:
    post:
      operationId: requestSignupOtp
      summary: Request a one-time code for account setup
      description: >
        Responses do not reveal whether a phone is registered. Codes are sent
        only through the configured SMS provider; delivery failures are returned
        explicitly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, role]
              properties:
                phone:
                  type: string
                  description: Kenyan mobile number; common local and +254 formats accepted.
                  example: "0712345678"
                role:
                  type: string
                  enum: [MERCHANT, RIDER]
      responses:
        "200":
          description: Generic accepted response, independent of account existence.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresInSeconds, retryAfterSeconds, message]
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  expiresInSeconds:
                    type: integer
                    const: 300
                  retryAfterSeconds:
                    type: integer
                    const: 60
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /auth/otp/verify:
    post:
      operationId: verifyLoginOtp
      summary: Verify an OTP and create a session
      description: Requires the PWA client header and an allow-listed Origin because verification sets a refresh cookie.
      security: []
      parameters:
        - in: header
          name: X-Beez-Client
          required: true
          schema:
            type: string
            const: pwa
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                role:
                  type: string
                  enum: [MERCHANT, RIDER]
      responses:
        "200":
          description: Access token and role/status metadata; refresh token is an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: beez_refresh; HttpOnly; SameSite=Lax; Path=/api/v1/auth
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the HttpOnly refresh cookie and access token
      description: Requires the PWA client header and an allow-listed Origin.
      security: []
      parameters:
        - in: header
          name: X-Beez-Client
          required: true
          schema:
            type: string
            const: pwa
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotated session. Reusing a previously rotated token revokes its family.
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh-token family
      security: []
      parameters:
        - in: header
          name: X-Beez-Client
          required: true
          schema:
            type: string
            const: pwa
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session family revoked and refresh cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all sessions for the current user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All refresh sessions revoked and access-token version incremented.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/me:
    get:
      operationId: currentUser
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account and onboarding status.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateCurrentUser
      summary: Update the current user profile
      description: >
        Updates profile fields. To complete initial setup, merchants must
        provide displayName, shopName and area; riders must provide displayName
        and area and cannot set shopName. Rider accounts remain pending approval
        after setup.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
                shopName:
                  type: string
                  maxLength: 120
                  description: Required for merchants and omitted for riders.
                area:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Merchant market or rider delivery area.
                language:
                  type: string
                  enum: [en, sw]
      responses:
        "200":
          description: Updated account and onboarding status.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /public/baskets/{trackingToken}/pay:
    post:
      operationId: startBasketPayment
      summary: Start or resume sandbox M-Pesa checkout for a basket
      description: >
        The tracking token is a basket capability. A repeated request reuses
        the existing payment attempt and does not issue a duplicate STK prompt.
        Payment remains unconfirmed until the provider callback is verified.
      parameters:
        - name: trackingToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment initiation or current payment state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStart"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /payments/callback/{token}:
    post:
      operationId: receiveDarajaPaymentCallback
      summary: Receive a Daraja STK result callback
      description: >
        The path token is a shared secret configured on the backend and must
        not be disclosed. The callback is only acknowledged here; settlement
        occurs after a separate Daraja transaction verification.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Callback accepted for asynchronous verification.
          content:
            application/json:
              schema:
                type: object
                required: [ResultCode, ResultDesc]
                properties:
                  ResultCode:
                    type: integer
                    const: 0
                  ResultDesc:
                    type: string
                    const: Accepted
        "400":
          description: Invalid callback payload.
        "404":
          description: Callback token is invalid.
  /merchants/me/orders/summary:
    get:
      operationId: merchantOrderSummary
      summary: Get this merchant's paid order summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paid-order counts and current-month merchandise sales.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantOrderSummary"
        "401":
          $ref: "#/components/responses/ApiError"
  /merchants/me/dashboard:
    get:
      operationId: merchantDashboard
      summary: Get this merchant's consolidated dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Owner-scoped shop, Nairobi-day order and month-to-date order
            totals, available earnings, and catalogue counts.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, shop, today, orders, earnings, productCount, inStockProductCount]
                properties:
                  serverTime:
                    type: string
                    format: date-time
                  shop:
                    oneOf:
                      - $ref: "#/components/schemas/MerchantShop"
                      - type: "null"
                  today:
                    type: object
                    required: [paidOrdersToday, paidMerchandiseKesToday]
                    properties:
                      paidOrdersToday:
                        type: integer
                      paidMerchandiseKesToday:
                        type: integer
                  orders:
                    $ref: "#/components/schemas/MerchantOrderSummary"
                  earnings:
                    oneOf:
                      - $ref: "#/components/schemas/MerchantEarningsSummary"
                      - type: "null"
                  productCount:
                    type: integer
                  inStockProductCount:
                    type: integer
        "401":
          $ref: "#/components/responses/ApiError"
  /merchants/me/shop/availability:
    patch:
      operationId: updateMerchantAvailability
      summary: Update the merchant's accepting-orders status and weekly hours
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isOpen]
              properties:
                isOpen:
                  type: boolean
                openingHours:
                  type: object
                  description: Optional complete seven-day schedule in the merchant's local timezone.
                  additionalProperties:
                    $ref: "#/components/schemas/BusinessHours"
                  minProperties: 7
                  maxProperties: 7
      responses:
        "200":
          description: Updated merchant shop settings.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantShop"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /merchants/me/voice-products:
    post:
      operationId: extractMerchantVoiceProducts
      summary: Create an ephemeral product draft from merchant audio
      description: >
        Merchant audio is sent to Beez and OpenAI for transcription and
        extraction. Beez does not persist audio or transcript data. Maximum
        upload size is 10 MB; per-merchant limit is 10 requests and 50 MB/hour.
        Nothing is added to the catalogue by this operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, language]
              properties:
                audio:
                  type: string
                  format: binary
                  description: WebM, Ogg, MP4, or MPEG audio; maximum 10 MB.
                language:
                  type: string
                  enum: [en, sw]
      responses:
        "200":
          description: Ephemeral, reviewable product drafts.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [transcript, products, unparsedPhrases]
                properties:
                  transcript:
                    type: string
                  products:
                    type: array
                    maxItems: 30
                    items:
                      $ref: "#/components/schemas/VoiceProductDraft"
                  unparsedPhrases:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          description: Audio is larger than the configured request limit.
        "415":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /merchants/me/products/batch:
    post:
      operationId: createMerchantProducts
      summary: Add reviewed merchant product drafts atomically
      description: Adds all supplied catalogue products in one transaction; batch size is 1–30.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    $ref: "#/components/schemas/MerchantProductWrite"
      responses:
        "201":
          description: All created products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /merchants/me/orders:
    get:
      operationId: listMerchantOrders
      summary: List this merchant's paid orders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PAID, READY, PICKED_UP, DELIVERED, REJECTED]
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of at most 20 orders.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantOrderPage"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /merchants/me/orders/{orderId}:
    get:
      operationId: getMerchantOrder
      summary: Get one of this merchant's orders
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Merchant order details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantOrder"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /merchants/me/orders/{orderId}/ready:
    patch:
      operationId: markMerchantOrderReady
      summary: Mark a paid merchant order ready for pickup
      description: The operation is audited and permits only PAID to READY.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated merchant order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantOrder"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /merchants/me/orders/{orderId}/reject:
    post:
      operationId: rejectMerchantOrder
      summary: Reject a paid shop order and create a refund request
      description: >
        Requires a 1-240 character reason. Only PAID orders can be rejected.
        The service creates a pending external-refund request; it does not
        initiate an M-Pesa refund.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 240
      responses:
        "200":
          description: Rejected merchant order and pending refund status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantOrder"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /merchants/me/earnings:
    get:
      operationId: merchantEarnings
      summary: Get ledger-backed merchant earnings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available merchant balance and delivered-order count.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantEarnings"
        "401":
          $ref: "#/components/responses/ApiError"
  /merchants/me/earnings/history:
    get:
      operationId: merchantEarningsHistory
      summary: List recent merchant ledger entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 50 most recent ledger entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantLedgerPage"
        "401":
          $ref: "#/components/responses/ApiError"
  /riders/me/earnings:
    get:
      operationId: riderEarnings
      summary: Get ledger-backed rider earnings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rider ledger balance, completed deliveries and the 5% platform share of delivery fees.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderEarnings"
        "401":
          $ref: "#/components/responses/ApiError"
  /riders/me/earnings/history:
    get:
      operationId: riderEarningsHistory
      summary: List recent rider ledger entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 50 most recent rider ledger entries.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderLedgerPage"
        "401":
          $ref: "#/components/responses/ApiError"
  /admin/auth/login:
    post:
      operationId: adminLogin
      summary: Sign in to the admin console
      description: >
        Separate named admin email/password/TOTP sign-in. There is no public
        admin signup or refresh token. The returned bearer token expires after
        at most eight hours and must be held in browser memory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, authenticatorCode]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  maxLength: 128
                authenticatorCode:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Admin bearer session and pilot permissions.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /admin/auth/step-up:
    post:
      operationId: adminStepUp
      summary: Re-verify admin authenticator for sensitive work
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authenticatorCode]
              properties:
                authenticatorCode:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: New bearer token with refreshed MFA verification time and the original expiry.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /admin/auth/me:
    get:
      operationId: adminMe
      summary: Get the current admin identity and permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current admin identity and session security timestamps.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          $ref: "#/components/responses/ApiError"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: Revoke the current admin access token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The admin account token version was incremented; the token is invalidated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "401":
          $ref: "#/components/responses/ApiError"
  /operations/dashboard:
    get:
      operationId: getOperationsDashboard
      summary: Get live admin operations metrics
      description: >
        Counts baskets and verified payment value for the Africa/Nairobi
        business day. Delivery duration is the rounded average in minutes for
        deliveries completed during that day; it is null when none completed.
        Attention counts represent actionable pending approvals, payment
        exceptions, failed deliveries, pending withdrawals, and pending refunds.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live operations metrics and counts that link to admin work queues.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSummary"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /operations/riders/pending:
    get:
      operationId: pendingAdminRiders
      summary: List riders awaiting approval
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 100 pending riders with masked phone numbers.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingAdminRider"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /operations/riders/{riderUserId}/approve:
    patch:
      operationId: approveAdminRider
      summary: Approve a pending rider
      description: Requires admin role and an authenticator verification within ten minutes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: riderUserId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Rider approved and operations audit event recorded.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /operations/refunds/pending:
    get:
      operationId: pendingAdminRefunds
      summary: List merchant refund requests awaiting resolution
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 100 pending refunds with masked customer numbers.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingAdminRefund"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /operations/refunds/{requestId}/confirm:
    post:
      operationId: confirmAdminRefund
      summary: Record a refund already paid through the provider
      description: Requires a provider reference and a fresh admin authenticator check.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerReference]
              properties:
                providerReference:
                  type: string
                  minLength: 4
                  maxLength: 64
      responses:
        "204":
          description: Refund status and ledger were updated; audit event recorded.
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /operations/refunds/{requestId}/fail:
    post:
      operationId: failAdminRefund
      summary: Mark a refund request as failed with a reason
      description: Requires a reason and a fresh admin authenticator check.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 240
      responses:
        "204":
          description: Refund marked failed and operations audit event recorded.
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VoiceProductDraft:
      type: object
      required: [name, unit, priceKes, confidence, sourcePhrase]
      properties:
        name:
          type: string
          maxLength: 120
        unit:
          type: [string, "null"]
          maxLength: 40
        priceKes:
          type: integer
          minimum: 0
          maximum: 100000000
        confidence:
          type: number
          minimum: 0
          maximum: 1
        sourcePhrase:
          type: string
          maxLength: 240
    MerchantProductWrite:
      type: object
      required: [name, priceKes, inStock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        unit:
          type: [string, "null"]
          maxLength: 40
        priceKes:
          type: integer
          minimum: 0
          maximum: 100000000
        inStock:
          type: boolean
    MerchantProduct:
      allOf:
        - $ref: "#/components/schemas/MerchantProductWrite"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    AdminSession:
      type: object
      required: [accessToken, tokenType, expiresAt, mfaVerifiedAt, admin]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        mfaVerifiedAt:
          type: string
          format: date-time
        admin:
          $ref: "#/components/schemas/AdminIdentity"
    AdminMe:
      type: object
      required: [admin, mfaVerifiedAt, sessionExpiresAt]
      properties:
        admin:
          $ref: "#/components/schemas/AdminIdentity"
        mfaVerifiedAt:
          type: [string, "null"]
          format: date-time
        sessionExpiresAt:
          type: string
          format: date-time
    AdminIdentity:
      type: object
      required: [id, email, displayName, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        permissions:
          type: array
          items:
            type: string
    OperationsSummary:
      type: object
      required:
        - ordersToday
        - paidTodayKes
        - activeMerchants
        - activeRiders
        - averageDeliveryMinutes
        - openDeliveries
        - failedDeliveries
        - pendingMerchantApprovals
        - pendingRiderApprovals
        - paymentIssues
        - pendingWithdrawals
        - pendingRefunds
        - attentionItems
        - asOf
      properties:
        ordersToday:
          type: integer
          minimum: 0
        paidTodayKes:
          type: integer
          minimum: 0
        activeMerchants:
          type: integer
          minimum: 0
        activeRiders:
          type: integer
          minimum: 0
        averageDeliveryMinutes:
          type: [integer, "null"]
          minimum: 0
        openDeliveries:
          type: integer
          minimum: 0
        failedDeliveries:
          type: integer
          minimum: 0
        pendingMerchantApprovals:
          type: integer
          minimum: 0
        pendingRiderApprovals:
          type: integer
          minimum: 0
        paymentIssues:
          type: integer
          minimum: 0
        pendingWithdrawals:
          type: integer
          minimum: 0
        pendingRefunds:
          type: integer
          minimum: 0
        attentionItems:
          type: integer
          minimum: 0
        asOf:
          type: string
          format: date-time
    PendingAdminRider:
      type: object
      required: [userId, displayName, phoneMasked, area, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: [string, "null"]
        phoneMasked:
          type: [string, "null"]
        area:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    PendingAdminRefund:
      type: object
      required: [id, orderId, basketNo, merchantName, customerPhoneMasked, amountKes, reason, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        basketNo:
          type: string
        merchantName:
          type: string
        customerPhoneMasked:
          type: [string, "null"]
        amountKes:
          type: integer
          minimum: 0
        reason:
          type: string
        requestedAt:
          type: string
          format: date-time
    PaymentStart:
      type: object
      required: [paymentId, status, message, deliveryCode]
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [INITIATED, PENDING, SUCCEEDED, FAILED, TIMEOUT, REVIEW]
        message:
          type: string
        deliveryCode:
          type: [string, "null"]
          pattern: "^[0-9]{6}$"
    BusinessHours:
      type: object
      required: [open, opensAt, closesAt]
      properties:
        open:
          type: boolean
        opensAt:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
        closesAt:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
    MerchantShop:
      type: object
      required:
        [id, slug, businessName, category, zoneId, zoneName, locationText, status, lat, lng, payoutPhone, isOpen, openingHours]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 60
        businessName:
          type: string
        category:
          type: string
        zoneId:
          type: string
          format: uuid
        zoneName:
          type: string
        locationText:
          type: string
        status:
          type: string
        lat:
          type: number
        lng:
          type: number
        payoutPhone:
          type: [string, "null"]
        isOpen:
          type: boolean
        openingHours:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BusinessHours"
    MerchantEarningsSummary:
      type: object
      required: [availableKes, deliveredOrders, commissionPercent]
      properties:
        availableKes:
          type: integer
          minimum: 0
        deliveredOrders:
          type: integer
          minimum: 0
        commissionPercent:
          type: integer
          minimum: 0
    MerchantOrderSummary:
      type: object
      required: [preparingCount, readyCount, paidOrdersThisMonth, paidMerchandiseKesThisMonth]
      properties:
        preparingCount:
          type: integer
          minimum: 0
        readyCount:
          type: integer
          minimum: 0
        paidOrdersThisMonth:
          type: integer
          minimum: 0
        paidMerchandiseKesThisMonth:
          type: integer
          minimum: 0
    MerchantOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchantOrder"
        nextCursor:
          type: [string, "null"]
    MerchantOrder:
      type: object
      required:
        [
          id,
          basketNo,
          status,
          subtotalKes,
          paidAt,
          readyAt,
          customerName,
          customerPhone,
          deliveryLandmark,
          refundStatus,
          riderName,
          riderPhone,
          items,
        ]
      properties:
        id:
          type: string
          format: uuid
        basketNo:
          type: string
        status:
          type: string
          enum: [PAID, READY, PICKED_UP, DELIVERED, REJECTED]
        subtotalKes:
          type: integer
          minimum: 0
        paidAt:
          type: string
          format: date-time
        readyAt:
          type: [string, "null"]
          format: date-time
        customerName:
          type: string
        customerPhone:
          type: string
        deliveryLandmark:
          type: string
        refundStatus:
          type: [string, "null"]
          enum: [PENDING, CONFIRMED, FAILED, NOT_REQUIRED, null]
        riderName:
          type: [string, "null"]
        riderPhone:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchantOrderItem"
    MerchantOrderItem:
      type: object
      required: [productId, name, qty, unitPriceKes, lineTotalKes]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        qty:
          type: integer
          minimum: 1
        unitPriceKes:
          type: integer
          minimum: 0
        lineTotalKes:
          type: integer
          minimum: 0
    MerchantEarnings:
      type: object
      required: [availableKes, deliveredOrders, commissionPercent]
      properties:
        availableKes:
          type: integer
          minimum: 0
        deliveredOrders:
          type: integer
          minimum: 0
        commissionPercent:
          type: integer
          const: 5
    MerchantLedgerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchantLedgerEntry"
    MerchantLedgerEntry:
      type: object
      required: [type, description, amountKes, createdAt, orderNumber]
      properties:
        type:
          type: string
          enum: [CREDIT, DEBIT]
        description:
          type: string
        amountKes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        orderNumber:
          type: [string, "null"]
    RiderEarnings:
      type: object
      required: [balanceKes, completedDeliveries, commissionPercent]
      properties:
        balanceKes:
          type: integer
          minimum: 0
        completedDeliveries:
          type: integer
          minimum: 0
        commissionPercent:
          type: integer
          const: 5
    RiderLedgerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RiderLedgerEntry"
    RiderLedgerEntry:
      type: object
      required: [type, description, amountKes, createdAt, basketNumber]
      properties:
        type:
          type: string
          enum: [CREDIT, DEBIT]
        description:
          type: string
        amountKes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        basketNumber:
          type: [string, "null"]
    User:
      type: object
      required:
        [
          id,
          role,
          status,
          onboardingStatus,
          onboardingRequired,
          displayName,
          shopName,
          area,
          phone,
          language,
        ]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [MERCHANT, RIDER]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
        onboardingStatus:
          type: string
          enum: [ONBOARDING, PENDING_APPROVAL, COMPLETE]
        onboardingRequired:
          type: boolean
        displayName:
          type: [string, "null"]
        shopName:
          type: [string, "null"]
        area:
          type: [string, "null"]
        phone:
          type: string
        language:
          type: string
          enum: [en, sw]
    Session:
      type: object
      required: [accessToken, tokenType, expiresIn, user, refreshExpiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    ApiError:
      type: object
      required: [error, message, details, requestId]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
        requestId:
          type: string
          format: uuid
  responses:
    ApiError:
      description: Standard no-store API error response.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
