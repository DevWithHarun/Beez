name: beez-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beez
      POSTGRES_USER: beez
      POSTGRES_PASSWORD: beez-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beez -d beez"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - path: ../../.env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: sandbox
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/beez
      DATABASE_USERNAME: beez
      DATABASE_PASSWORD: beez-dev-only
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
      REFRESH_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beez-dev
      MINIO_ROOT_PASSWORD: beez-dev-only-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
